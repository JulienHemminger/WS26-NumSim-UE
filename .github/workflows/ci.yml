name: C++ CI Pipeline

on:
  push:
    branches: [ main, julien-dev ]
  pull_request:
    branches: [ main, julien-dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ python3 python3-numpy python3-vtk9 libvtk9-dev qtbase5-dev libqt5opengl5-dev

    - name: Download and Cache Reference Data
      uses: actions/cache@v4
      id: cache-ref-data
      with:
        path: |
          test/0_driven_cavity/reference_output
          test/3_varying_params/reference_output
        key: ref-data-v1.0.0

    - name: Fetch Reference Data from Release
      if: steps.cache-ref-data.outputs.cache-hit != 'true'
      run: |
        curl --fail --location --retry 3 -o ref_data.zip "https://github.com/JulienHemminger/WS26-NumSim-UE/releases/download/v1.0.0/reference_data.zip"
        unzip -o ref_data.zip -d .
        rm ref_data.zip

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DNUMSIM_REFERENCE_ROOT="${GITHUB_WORKSPACE}/test"

    - name: Build project
      run: cmake --build build --config Release

    - name: Run CTest
      run: ctest --test-dir build --output-on-failure